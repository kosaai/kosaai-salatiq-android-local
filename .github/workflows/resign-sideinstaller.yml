name: Re-sign SideInstaller with Apple codesign

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "SideInstaller IPA URL"
        required: true
        default: "https://receivers-discussing-sewing-fragrances.trycloudflare.com/app.ipa"

jobs:
  resign:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -fL "${{ inputs.ipa_url }}" -o SideInstaller.ipa
          ls -lh SideInstaller.ipa

      - name: Extract IPA
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q SideInstaller.ipa -d extracted
          test -d extracted/Payload/SideInstaller.app
          echo "IPA extracted OK"

      - name: Decode private key
        env:
          KEY_BASE64: ${{ secrets.APPLE_KEY_PEM_BASE64 }}
        run: |
          printf '%s' "$KEY_BASE64" | base64 --decode > private-key.pem

          test -s private-key.pem

          openssl pkey \
            -in private-key.pem \
            -check \
            -noout

          echo "Private key OK"

      - name: Decode provisioning profile
        run: |
          APP="extracted/Payload/SideInstaller.app"

          security cms \
            -D \
            -i "$APP/embedded.mobileprovision" \
            > profile.plist

          echo "Provisioning profile decoded"

      - name: Extract certificates and entitlements from profile
        run: |
          python3 - <<'PY'
          import plistlib
          import os

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          print("Profile:", profile.get("Name"))
          print("Team:", profile.get("TeamIdentifier"))
          print("Expires:", profile.get("ExpirationDate"))

          certs = profile.get("DeveloperCertificates", [])

          if not certs:
              raise SystemExit("No DeveloperCertificates found in provisioning profile")

          print("Developer certificates:", len(certs))

          for i, cert in enumerate(certs):
              path = f"developer-cert-{i}.cer"
              with open(path, "wb") as f:
                  f.write(cert)
              print("Extracted:", path)

          entitlements = profile["Entitlements"]

          with open("entitlements.plist", "wb") as f:
              plistlib.dump(
                  entitlements,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )

          print("App ID:", entitlements.get("application-identifier"))
          PY

      - name: Find certificate matching private key
        run: |
          KEY_HASH="$(
            openssl pkey \
              -in private-key.pem \
              -pubout \
              -outform DER |
            shasum -a 256 |
            awk '{print $1}'
          )"

          echo "Private key public hash: $KEY_HASH"

          FOUND=""

          for CERT in developer-cert-*.cer; do
            CERT_HASH="$(
              openssl x509 \
                -inform DER \
                -in "$CERT" \
                -pubkey \
                -noout |
              openssl pkey \
                -pubin \
                -outform DER |
              shasum -a 256 |
              awk '{print $1}'
            )"

            echo "$CERT -> $CERT_HASH"

            if [ "$CERT_HASH" = "$KEY_HASH" ]; then
              cp "$CERT" certificate.cer
              FOUND="$CERT"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: No certificate in provisioning profile matches private key"
            exit 1
          fi

          echo "Matching certificate found: $FOUND"

          openssl x509 \
            -inform DER \
            -in certificate.cer \
            -noout \
            -subject \
            -serial \
            -dates

      - name: Create temporary macOS Keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/sideinstaller.keychain-db"

          security create-keychain \
            -p "temporary-password" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "temporary-password" \
            "$KEYCHAIN"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN" $EXISTING_KEYCHAINS

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Import Apple certificate
        run: |
          security import certificate.cer \
            -k "$KEYCHAIN" \
            -f x509 \
            -A \
            -T /usr/bin/codesign

          echo "Certificate imported"

      - name: Import private key
        run: |
          security import private-key.pem \
            -k "$KEYCHAIN" \
            -f openssl \
            -A \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            "$KEYCHAIN"

          echo "Private key imported"

      - name: Find signing identity
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN"

          IDENTITY="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN" |
            awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}'
          )"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No valid signing identity found"
            exit 1
          fi

          echo "Using identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Re-sign embedded frameworks
        run: |
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then

            find "$APP/Frameworks" -type f -name "*.dylib" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing dylib: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done

            find "$APP/Frameworks" -depth -type d -name "*.framework" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing framework: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done

          else
            echo "No embedded frameworks"
          fi

      - name: Re-sign SideInstaller with Apple codesign
        run: |
          APP="extracted/Payload/SideInstaller.app"

          rm -rf "$APP/_CodeSignature"

          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          echo "Apple codesign completed"

      - name: Verify Apple signature
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"

          codesign \
            -d \
            --verbose=4 \
            "$APP" \
            2>&1

          echo "----- ENTITLEMENTS -----"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1

      - name: Build final IPA
        run: |
          cd extracted

          zip \
            -qry \
            ../SideInstaller-Apple-codesign.ipa \
            Payload

          cd ..

          ls -lh SideInstaller-Apple-codesign.ipa

      - name: Verify final IPA
        run: |
          rm -rf final-check
          mkdir final-check

          unzip \
            -q \
            SideInstaller-Apple-codesign.ipa \
            -d final-check

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            final-check/Payload/SideInstaller.app

          echo "FINAL IPA SIGNATURE OK"

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Apple-codesign
          path: SideInstaller-Apple-codesign.ipa
          retention-days: 3
