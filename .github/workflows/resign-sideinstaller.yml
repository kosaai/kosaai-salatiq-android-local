name: Re-sign SideInstaller with Apple codesign

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL of the signed SideInstaller IPA"
        required: true
        default: "https://receivers-discussing-sewing-fragrances.trycloudflare.com/app.ipa"

jobs:
  resign:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -fL "${{ inputs.ipa_url }}" -o SideInstaller.ipa
          ls -lh SideInstaller.ipa

      - name: Extract IPA
        run: |
          mkdir extracted
          unzip -q SideInstaller.ipa -d extracted
          test -d extracted/Payload/SideInstaller.app

      - name: Decode signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          ls -lh signing.p12

      - name: Create temporary keychain and import certificate
        env:
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          security create-keychain -p "temporary-password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "temporary-password" build.keychain

          security import signing.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            build.keychain

          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Extract provisioning entitlements
        run: |
          security cms -D \
            -i extracted/Payload/SideInstaller.app/embedded.mobileprovision \
            > profile.plist

          python3 - <<'PY'
          import plistlib
          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)
          entitlements = profile["Entitlements"]
          with open("entitlements.plist", "wb") as f:
              plistlib.dump(entitlements, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Re-sign nested frameworks
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' ITEM; do
              codesign --force --sign "$IDENTITY" --timestamp=none "$ITEM"
            done
          fi

      - name: Re-sign SideInstaller using Apple codesign
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

      - name: Verify new Apple signature
        run: |
          codesign --verify --deep --strict --verbose=4 extracted/Payload/SideInstaller.app
          codesign -d --entitlements :- extracted/Payload/SideInstaller.app

      - name: Build new IPA
        run: |
          cd extracted
          zip -qry ../SideInstaller-Apple-codesign.ipa Payload
          cd ..
          ls -lh SideInstaller-Apple-codesign.ipa

      - name: Upload re-signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Apple-codesign
          path: SideInstaller-Apple-codesign.ipa
          retention-days: 3
