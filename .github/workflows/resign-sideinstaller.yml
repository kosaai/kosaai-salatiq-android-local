name: Re-sign SideInstaller with Apple codesign

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "SideInstaller IPA URL"
        required: true
        default: "https://receivers-discussing-sewing-fragrances.trycloudflare.com/app.ipa"

jobs:
  resign:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -fL "${{ inputs.ipa_url }}" -o SideInstaller.ipa
          ls -lh SideInstaller.ipa

      - name: Extract IPA
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q SideInstaller.ipa -d extracted

          test -d extracted/Payload/SideInstaller.app
          echo "IPA extracted OK"

      - name: Decode Apple certificate and private key
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERT_PEM_BASE64 }}
          KEY_BASE64: ${{ secrets.APPLE_KEY_PEM_BASE64 }}
        run: |
          printf '%s' "$CERT_BASE64" | base64 --decode > certificate.pem
          printf '%s' "$KEY_BASE64" | base64 --decode > private-key.pem

          test -s certificate.pem
          test -s private-key.pem

          echo "Certificate:"
          openssl x509 \
            -in certificate.pem \
            -noout \
            -subject \
            -serial \
            -dates

          echo "Private key:"
          openssl pkey \
            -in private-key.pem \
            -check \
            -noout

      - name: Convert signing files for macOS Keychain
        run: |
          openssl x509 \
            -in certificate.pem \
            -outform DER \
            -out certificate.cer

          openssl pkcs8 \
            -topk8 \
            -nocrypt \
            -in private-key.pem \
            -outform DER \
            -out private-key.p8

          ls -lh certificate.cer private-key.p8

      - name: Verify certificate matches private key
        run: |
          CERT_HASH="$(
            openssl x509 -in certificate.pem -pubkey -noout |
            openssl pkey -pubin -outform DER |
            shasum -a 256 |
            awk '{print $1}'
          )"

          KEY_HASH="$(
            openssl pkey -in private-key.pem -pubout -outform DER |
            shasum -a 256 |
            awk '{print $1}'
          )"

          echo "Certificate public key: $CERT_HASH"
          echo "Private key public key: $KEY_HASH"

          test "$CERT_HASH" = "$KEY_HASH"

          echo "Certificate and private key MATCH"

      - name: Create temporary macOS Keychain
        run: |
          security create-keychain \
            -p "temporary-password" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "temporary-password" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain

          security default-keychain \
            -d user \
            -s build.keychain

      - name: Import Apple certificate and private key
        run: |
          security import certificate.cer \
            -k build.keychain \
            -f x509 \
            -A \
            -T /usr/bin/codesign

          security import private-key.p8 \
            -k build.keychain \
            -f pkcs8 \
            -A \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            build.keychain

          echo "Signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            build.keychain

      - name: Select signing identity
        run: |
          IDENTITY="$(
            security find-identity \
              -v \
              -p codesigning \
              build.keychain |
            awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}'
          )"

          if [ -z "$IDENTITY" ]; then
            echo "No valid Apple signing identity found"
            exit 1
          fi

          echo "Signing identity SHA1: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Read provisioning profile
        run: |
          APP="extracted/Payload/SideInstaller.app"

          security cms \
            -D \
            -i "$APP/embedded.mobileprovision" \
            > profile.plist

          python3 - <<'PY'
          import plistlib

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          print("Profile:", profile.get("Name"))
          print("Team:", profile.get("TeamIdentifier"))
          print("Expires:", profile.get("ExpirationDate"))
          print("Devices:", profile.get("ProvisionedDevices"))

          entitlements = profile["Entitlements"]

          print("App ID:", entitlements.get("application-identifier"))

          with open("entitlements.plist", "wb") as f:
              plistlib.dump(
                  entitlements,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )
          PY

      - name: Remove old code signature
        run: |
          APP="extracted/Payload/SideInstaller.app"

          rm -rf "$APP/_CodeSignature"

          echo "Old _CodeSignature removed"

      - name: Re-sign nested components
        run: |
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then

            find "$APP/Frameworks" -type f -name "*.dylib" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing dylib: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done

            find "$APP/Frameworks" -type d -name "*.framework" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing framework: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done

          else
            echo "No embedded Frameworks"
          fi

      - name: Sign SideInstaller with Apple codesign
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          echo "Apple codesign finished"

      - name: Verify Apple signature
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"

          echo "----- SIGNING INFO -----"

          codesign \
            -d \
            --verbose=4 \
            "$APP" \
            2>&1

          echo "----- ENTITLEMENTS -----"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1

      - name: Build Apple-signed IPA
        run: |
          cd extracted

          zip \
            -qry \
            ../SideInstaller-Apple-codesign.ipa \
            Payload

          cd ..

          ls -lh SideInstaller-Apple-codesign.ipa

      - name: Verify final IPA
        run: |
          rm -rf final-check
          mkdir final-check

          unzip \
            -q \
            SideInstaller-Apple-codesign.ipa \
            -d final-check

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            final-check/Payload/SideInstaller.app

          echo "FINAL IPA SIGNATURE OK"

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Apple-codesign
          path: SideInstaller-Apple-codesign.ipa
          retention-days: 3
