name: Re-sign SideInstaller with DxSign P12

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "SideInstaller IPA URL"
        required: true
        default: "https://github.com/FrizzleM/SideInstaller/releases/download/v1.3.0/SideInstaller.ipa"

jobs:
  resign:
    runs-on: macos-latest

    steps:
      - name: Download SideInstaller
        run: |
          curl -fL "${{ inputs.ipa_url }}" -o SideInstaller.ipa
          ls -lh SideInstaller.ipa

      - name: Extract IPA
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q SideInstaller.ipa -d extracted

          test -d extracted/Payload/SideInstaller.app

          echo "IPA extracted OK"

      - name: Decode DxSign files
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.APPLE_MOBILEPROVISION_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64

          p12 = base64.b64decode(os.environ["P12_BASE64"])
          profile = base64.b64decode(os.environ["PROFILE_BASE64"])

          with open("signing.p12", "wb") as f:
              f.write(p12)

          with open("profile.mobileprovision", "wb") as f:
              f.write(profile)

          print("P12 decoded:", len(p12), "bytes")
          print("Profile decoded:", len(profile), "bytes")
          PY

          test -s signing.p12
          test -s profile.mobileprovision

          echo "DxSign files decoded OK"

      - name: Decode provisioning profile
        run: |
          security cms \
            -D \
            -i profile.mobileprovision \
            > profile.plist

          echo "Provisioning profile decoded OK"

      - name: Prepare profile entitlements and Bundle ID
        run: |
          APP="extracted/Payload/SideInstaller.app"

          cp profile.mobileprovision "$APP/embedded.mobileprovision"

          python3 - <<'PY'
          import plistlib

          app_path = "extracted/Payload/SideInstaller.app"
          info_path = app_path + "/Info.plist"

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          entitlements = profile["Entitlements"]

          app_identifier = entitlements.get("application-identifier")

          if not app_identifier:
              raise SystemExit("ERROR: Profile has no application-identifier")

          prefixes = (
              profile.get("ApplicationIdentifierPrefix")
              or profile.get("TeamIdentifier")
          )

          if not prefixes:
              raise SystemExit("ERROR: Cannot determine Team/App ID prefix")

          prefix = prefixes[0]

          with open(info_path, "rb") as f:
              info = plistlib.load(f)

          old_bundle = info.get("CFBundleIdentifier")

          expected_prefix = prefix + "."

          if app_identifier.startswith(expected_prefix):
              profile_bundle = app_identifier[len(expected_prefix):]
          else:
              profile_bundle = app_identifier

          if "*" in profile_bundle:
              new_bundle = old_bundle
              entitlements["application-identifier"] = (
                  prefix + "." + new_bundle
              )

              if "keychain-access-groups" in entitlements:
                  groups = []

                  for group in entitlements["keychain-access-groups"]:
                      if group.endswith(".*"):
                          groups.append(prefix + "." + new_bundle)
                      else:
                          groups.append(group)

                  entitlements["keychain-access-groups"] = groups

          else:
              new_bundle = profile_bundle

          info["CFBundleIdentifier"] = new_bundle

          with open(info_path, "wb") as f:
              plistlib.dump(
                  info,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False
              )

          with open("entitlements.plist", "wb") as f:
              plistlib.dump(
                  entitlements,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )

          print("Profile name:", profile.get("Name"))
          print("Team:", profile.get("TeamIdentifier"))
          print("Expires:", profile.get("ExpirationDate"))
          print("Original Bundle ID:", old_bundle)
          print("Signing Bundle ID:", new_bundle)
          print("Application identifier:",
                entitlements.get("application-identifier"))
          PY

          echo "Profile installed into app"

      - name: Create temporary macOS Keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/sideinstaller.keychain-db"

          security create-keychain \
            -p "temporary-password" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "temporary-password" \
            "$KEYCHAIN"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN" $EXISTING_KEYCHAINS

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Import DxSign P12
        env:
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          security import signing.p12 \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            "$KEYCHAIN"

          echo "P12 imported successfully"

      - name: Find signing identity
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN"

          IDENTITY="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN" |
            awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}'
          )"

          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No valid signing identity found"
            exit 1
          fi

          echo "Using identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Remove old signatures
        run: |
          APP="extracted/Payload/SideInstaller.app"

          rm -rf "$APP/_CodeSignature"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \
              -type d \
              -name "_CodeSignature" \
              -prune \
              -exec rm -rf {} + || true
          fi

          echo "Old signatures removed"

      - name: Sign embedded dylibs
        run: |
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \
              -type f \
              -name "*.dylib" \
              -print0 |
            while IFS= read -r -d '' ITEM; do

              echo "Signing dylib: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"

            done
          fi

      - name: Sign embedded frameworks
        run: |
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \
              -depth \
              -type d \
              -name "*.framework" \
              -print0 |
            while IFS= read -r -d '' ITEM; do

              echo "Signing framework: $ITEM"

              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"

            done
          fi

      - name: Sign SideInstaller
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          echo "SideInstaller signed"

      - name: Verify signature
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"

          echo "----- SIGNATURE -----"

          codesign \
            -d \
            --verbose=4 \
            "$APP" \
            2>&1

          echo "----- ENTITLEMENTS -----"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1

          echo "SIGNATURE OK"

      - name: Verify embedded provisioning profile
        run: |
          APP="extracted/Payload/SideInstaller.app"

          security cms \
            -D \
            -i "$APP/embedded.mobileprovision" \
            > embedded-profile.plist

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            embedded-profile.plist

          /usr/libexec/PlistBuddy \
            -c "Print :ExpirationDate" \
            embedded-profile.plist

          echo "Embedded profile OK"

      - name: Build final IPA
        run: |
          cd extracted

          zip \
            -qry \
            ../SideInstaller-DxSign.ipa \
            Payload

          cd ..

          ls -lh SideInstaller-DxSign.ipa

      - name: Final verification
        run: |
          rm -rf final-check
          mkdir final-check

          unzip \
            -q \
            SideInstaller-DxSign.ipa \
            -d final-check

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            final-check/Payload/SideInstaller.app

          echo "FINAL IPA SIGNATURE OK"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-DxSign
          path: SideInstaller-DxSign.ipa
          retention-days: 3
