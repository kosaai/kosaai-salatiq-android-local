name: Re-sign SideInstaller with Apple codesign

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL of the signed SideInstaller IPA"
        required: true
        default: "https://receivers-discussing-sewing-fragrances.trycloudflare.com/app.ipa"

jobs:
  resign:
    runs-on: macos-latest

    steps:
      - name: Download IPA
        run: |
          curl -fL "${{ inputs.ipa_url }}" -o SideInstaller.ipa
          ls -lh SideInstaller.ipa

      - name: Extract IPA
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q SideInstaller.ipa -d extracted
          test -d extracted/Payload/SideInstaller.app
          echo "IPA extracted successfully"

      - name: Decode P12
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
        run: |
          printf '%s' "$P12_BASE64" | base64 --decode > signing.p12
          ls -lh signing.p12
          test -s signing.p12

      - name: Extract certificate and private key
        env:
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          echo "OpenSSL:"
          openssl version

          rm -f certificate.pem private-key.pem certificate.cer private-key.p8

          if ! openssl pkcs12 \
            -in signing.p12 \
            -passin env:P12_PASSWORD \
            -clcerts \
            -nokeys \
            -out certificate.pem
          then
            echo "Normal PKCS12 read failed, trying legacy mode..."
            rm -f certificate.pem
            openssl pkcs12 \
              -legacy \
              -in signing.p12 \
              -passin env:P12_PASSWORD \
              -clcerts \
              -nokeys \
              -out certificate.pem
          fi

          if ! openssl pkcs12 \
            -in signing.p12 \
            -passin env:P12_PASSWORD \
            -nocerts \
            -nodes \
            -out private-key.pem
          then
            echo "Normal private-key extraction failed, trying legacy mode..."
            rm -f private-key.pem
            openssl pkcs12 \
              -legacy \
              -in signing.p12 \
              -passin env:P12_PASSWORD \
              -nocerts \
              -nodes \
              -out private-key.pem
          fi

          openssl x509 \
            -in certificate.pem \
            -outform DER \
            -out certificate.cer

          openssl pkcs8 \
            -topk8 \
            -nocrypt \
            -in private-key.pem \
            -outform DER \
            -out private-key.p8

          echo "Certificate:"
          openssl x509 \
            -in certificate.pem \
            -noout \
            -subject \
            -serial \
            -dates

          echo "Signing files prepared successfully"

      - name: Create temporary macOS keychain
        run: |
          security create-keychain \
            -p "temporary-password" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "temporary-password" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain

          security default-keychain \
            -d user \
            -s build.keychain

      - name: Import Apple certificate and private key
        run: |
          security import certificate.cer \
            -k build.keychain \
            -f x509 \
            -A

          security import private-key.p8 \
            -k build.keychain \
            -f pkcs8 \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "temporary-password" \
            build.keychain

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            build.keychain

          COUNT="$(security find-identity -v -p codesigning build.keychain | grep -c '"' || true)"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No Apple codesigning identity found"
            exit 1
          fi

      - name: Extract provisioning entitlements
        run: |
          security cms \
            -D \
            -i extracted/Payload/SideInstaller.app/embedded.mobileprovision \
            > profile.plist

          python3 - <<'PY'
          import plistlib

          with open("profile.plist", "rb") as f:
              profile = plistlib.load(f)

          print("Profile:", profile.get("Name"))
          print("Team:", profile.get("TeamIdentifier"))
          print("Expires:", profile.get("ExpirationDate"))
          print("Devices:", profile.get("ProvisionedDevices"))

          entitlements = profile["Entitlements"]

          with open("entitlements.plist", "wb") as f:
              plistlib.dump(
                  entitlements,
                  f,
                  fmt=plistlib.FMT_XML,
                  sort_keys=False
              )

          print("application-identifier:",
                entitlements.get("application-identifier"))
          PY

      - name: Find Apple signing identity
        run: |
          IDENTITY="$(security find-identity \
            -v \
            -p codesigning \
            build.keychain |
            grep '"' |
            head -1 |
            sed 's/.*"\(.*\)"/\1/')"

          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $IDENTITY"

      - name: Re-sign embedded frameworks
        run: |
          APP="extracted/Payload/SideInstaller.app"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -name "*.dylib" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing dylib: $ITEM"
              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done

            find "$APP/Frameworks" -type d -name "*.framework" -print0 |
            while IFS= read -r -d '' ITEM; do
              echo "Signing framework: $ITEM"
              codesign \
                --force \
                --sign "$IDENTITY" \
                --timestamp=none \
                "$ITEM"
            done
          else
            echo "No embedded Frameworks directory"
          fi

      - name: Re-sign SideInstaller using Apple codesign
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --force \
            --sign "$IDENTITY" \
            --entitlements entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          echo "Apple codesign completed"

      - name: Verify new Apple signature
        run: |
          APP="extracted/Payload/SideInstaller.app"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP"

          echo "---- SIGNING INFO ----"

          codesign \
            -d \
            --verbose=4 \
            "$APP" \
            2>&1

          echo "---- ENTITLEMENTS ----"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1

      - name: Build new IPA
        run: |
          cd extracted

          zip \
            -qry \
            ../SideInstaller-Apple-codesign.ipa \
            Payload

          cd ..

          ls -lh SideInstaller-Apple-codesign.ipa

      - name: Final IPA verification
        run: |
          rm -rf final-check
          mkdir final-check

          unzip \
            -q \
            SideInstaller-Apple-codesign.ipa \
            -d final-check

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            final-check/Payload/SideInstaller.app

          echo "FINAL IPA SIGNATURE OK"

      - name: Upload re-signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Apple-codesign
          path: SideInstaller-Apple-codesign.ipa
          retention-days: 3
