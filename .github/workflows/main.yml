name: Windows VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # RDP - يبقى موجود كخطة احتياط
      # ============================================================

      - name: Configure RDP Service and User
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $runnerAdminPass = "WindowsRDP#2025"

          net user "runneradmin" $runnerAdminPass

          "RDP_USER=runneradmin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASS=$runnerAdminPass" | Out-File -FilePath $env:GITHUB_ENV -Append


      # ============================================================
      # PERFORMANCE OPTIMIZATION
      # High Performance ON
      # Animations OFF
      # Transparency OFF
      # ============================================================

      - name: Optimize Windows Performance
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Optimizing Windows performance..."

          # High Performance
          try {
              Write-Host "Enabling High Performance power plan..."

              powercfg /setactive SCHEME_MIN

              if ($LASTEXITCODE -ne 0) {
                  powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
              }

              Write-Host "Current power plan:"
              powercfg /getactivescheme
          }
          catch {
              Write-Warning "Could not activate High Performance power plan."
          }

          # Disable Transparency
          try {
              $personalizePath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

              if (-not (Test-Path $personalizePath)) {
                  New-Item -Path $personalizePath -Force | Out-Null
              }

              New-ItemProperty `
                -Path $personalizePath `
                -Name "EnableTransparency" `
                -PropertyType DWord `
                -Value 0 `
                -Force | Out-Null

              Write-Host "Transparency disabled."
          }
          catch {
              Write-Warning "Could not disable transparency."
          }

          # Disable Window Animations
          try {
              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
                -Name "MinAnimate" `
                -Value "0" `
                -Force

              Write-Host "Window animations disabled."
          }
          catch {
              Write-Warning "Could not disable window animations."
          }

          # Disable Taskbar Animations
          try {
              $explorerAdvanced = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

              New-ItemProperty `
                -Path $explorerAdvanced `
                -Name "TaskbarAnimations" `
                -PropertyType DWord `
                -Value 0 `
                -Force | Out-Null

              Write-Host "Taskbar animations disabled."
          }
          catch {
              Write-Warning "Could not disable taskbar animations."
          }

          # Disable Aero Peek
          try {
              $dwmPath = "HKCU:\Software\Microsoft\Windows\DWM"

              if (-not (Test-Path $dwmPath)) {
                  New-Item -Path $dwmPath -Force | Out-Null
              }

              New-ItemProperty `
                -Path $dwmPath `
                -Name "EnableAeroPeek" `
                -PropertyType DWord `
                -Value 0 `
                -Force | Out-Null

              Write-Host "Aero Peek disabled."
          }
          catch {
              Write-Warning "Could not disable Aero Peek."
          }

          # Reduce Menu Delay
          try {
              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "MenuShowDelay" `
                -Value "0" `
                -Force

              Write-Host "Menu delay reduced."
          }
          catch {
              Write-Warning "Could not reduce menu delay."
          }

          # Refresh visual settings
          try {
              Start-Process `
                -FilePath "RUNDLL32.EXE" `
                -ArgumentList "user32.dll,UpdatePerUserSystemParameters" `
                -WindowStyle Hidden `
                -Wait
          }
          catch {
              Write-Warning "Could not refresh visual settings immediately."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Performance optimization completed"
          Write-Host "High Performance : ON"
          Write-Host "Animations       : OFF"
          Write-Host "Transparency     : OFF"
          Write-Host "=============================================="


      # ============================================================
      # DISPLAY + DEFAULT WINDOWS WALLPAPER
      # ============================================================

      - name: Configure Normal Display and Windows Wallpaper
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Configuring display and wallpaper..."

          # ----------------------------------------------------------
          # SCALE = 100%
          # ----------------------------------------------------------

          try {
              New-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "LogPixels" `
                -PropertyType DWord `
                -Value 96 `
                -Force | Out-Null

              New-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "Win8DpiScaling" `
                -PropertyType DWord `
                -Value 1 `
                -Force | Out-Null

              Write-Host "Display scaling configured for 100%."
          }
          catch {
              Write-Warning "Could not configure display scaling."
          }


          # ----------------------------------------------------------
          # RESOLUTION = 1920x1080
          # ----------------------------------------------------------

          $resolutionSet = $false

          try {
              if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
                  Set-DisplayResolution `
                    -Width 1920 `
                    -Height 1080 `
                    -Force `
                    -ErrorAction Stop

                  $resolutionSet = $true

                  Write-Host "Resolution set to 1920x1080 using Windows command."
              }
          }
          catch {
              Write-Warning "Built-in display resolution command failed."
          }

          if (-not $resolutionSet) {
              try {
                  Write-Host "Installing QRes..."

                  choco install qres -y --no-progress

                  $qres = Get-Command QRes.exe -ErrorAction SilentlyContinue

                  if ($qres) {
                      & $qres.Source /x:1920 /y:1080

                      Start-Sleep -Seconds 3

                      Write-Host "Resolution 1920x1080 requested with QRes."
                  }
                  else {
                      Write-Warning "QRes executable was not found."
                  }
              }
              catch {
                  Write-Warning "Could not change resolution using QRes."
              }
          }


          # ----------------------------------------------------------
          # FIND DEFAULT WINDOWS WALLPAPER
          # ----------------------------------------------------------

          $wallpaperCandidates = @(
              "$env:WINDIR\Web\Wallpaper\Windows\img0.jpg",
              "$env:WINDIR\Web\Wallpaper\Windows\img19.jpg",
              "$env:WINDIR\Web\4K\Wallpaper\Windows\img0_1920x1080.jpg"
          )

          $wallpaper = $null

          foreach ($candidate in $wallpaperCandidates) {
              if (Test-Path $candidate) {
                  $wallpaper = $candidate
                  break
              }
          }

          if (-not $wallpaper) {
              $foundWallpaper = Get-ChildItem `
                -Path "$env:WINDIR\Web\Wallpaper" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Extension -in ".jpg", ".jpeg", ".png"
                } |
                Select-Object -First 1

              if ($foundWallpaper) {
                  $wallpaper = $foundWallpaper.FullName
              }
          }


          # ----------------------------------------------------------
          # APPLY WALLPAPER
          # ----------------------------------------------------------

          if ($wallpaper) {
              Write-Host "Wallpaper found:"
              Write-Host $wallpaper

              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "Wallpaper" `
                -Value $wallpaper `
                -Force

              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "WallpaperStyle" `
                -Value "10" `
                -Force

              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "TileWallpaper" `
                -Value "0" `
                -Force

              try {
                  $nativeCode = 'using System; using System.Runtime.InteropServices; public static class NativeWallpaper { [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool SystemParametersInfo(int action, int param, string path, int flags); }'

                  Add-Type -TypeDefinition $nativeCode -ErrorAction SilentlyContinue

                  $result = [NativeWallpaper]::SystemParametersInfo(
                      20,
                      0,
                      $wallpaper,
                      3
                  )

                  Write-Host "Wallpaper API result: $result"
              }
              catch {
                  Write-Warning "Wallpaper API failed. Trying registry refresh."
              }

              try {
                  Start-Process `
                    -FilePath "RUNDLL32.EXE" `
                    -ArgumentList "user32.dll,UpdatePerUserSystemParameters" `
                    -WindowStyle Hidden `
                    -Wait
              }
              catch {
                  Write-Warning "Could not refresh wallpaper immediately."
              }

              Write-Host "Default Windows wallpaper configured."
          }
          else {
              Write-Warning "No Windows wallpaper was found."
          }


          # ----------------------------------------------------------
          # DISPLAY INFORMATION
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Current display information:"

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              CurrentHorizontalResolution,
              CurrentVerticalResolution |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Display configuration finished."


      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile "$env:RUNNER_TEMP\tailscale-setup.exe"

          Start-Process `
            -FilePath "$env:RUNNER_TEMP\tailscale-setup.exe" `
            -ArgumentList "/S" `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale executable was not found."
          }

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=github-windows-$env:GITHUB_RUN_ID

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {
              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1)

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              throw "Tailscale connected but no IPv4 address was received."
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"

          & $tailscale status


      # ============================================================
      # TIGHTVNC 2.8.90 - OFFICIAL MSI
      # ============================================================

      - name: Download TightVNC
        shell: powershell
        run: |
          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          $msi = "$env:RUNNER_TEMP\tightvnc-2.8.90.msi"

          Write-Host "Downloading TightVNC 2.8.90..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi

          if (-not (Test-Path $msi)) {
              throw "TightVNC MSI download failed."
          }

          Write-Host "TightVNC downloaded successfully."


      - name: Install and Configure TightVNC Server
        shell: powershell
        run: |
          $msi = "$env:RUNNER_TEMP\tightvnc-2.8.90.msi"

          $vncPassword = "Vnc25ABC"

          "VNC_PASS=$vncPassword" | Out-File -FilePath $env:GITHUB_ENV -Append

          $msiArgs = @(
              "/i"
              "`"$msi`""
              "/quiet"
              "/norestart"

              "ADDLOCAL=Server"

              "SERVER_REGISTER_AS_SERVICE=1"
              "SERVER_ADD_FIREWALL_EXCEPTION=0"

              "SET_USEVNCAUTHENTICATION=1"
              "VALUE_OF_USEVNCAUTHENTICATION=1"

              "SET_PASSWORD=1"
              "VALUE_OF_PASSWORD=$vncPassword"

              "SET_ACCEPTRFBCONNECTIONS=1"
              "VALUE_OF_ACCEPTRFBCONNECTIONS=1"

              "SET_RFBPORT=1"
              "VALUE_OF_RFBPORT=5900"

              "SET_RUNCONTROLINTERFACE=1"
              "VALUE_OF_RUNCONTROLINTERFACE=0"

              "SET_ALWAYSSHARED=1"
              "VALUE_OF_ALWAYSSHARED=1"

              "SET_ACCEPTHTTPCONNECTIONS=1"
              "VALUE_OF_ACCEPTHTTPCONNECTIONS=0"

              "SET_BLOCKREMOTEINPUT=1"
              "VALUE_OF_BLOCKREMOTEINPUT=0"
          )

          Write-Host "Installing TightVNC Server..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $msiArgs `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -notin @(0, 3010, 1641)) {
              throw "TightVNC installation failed with exit code $($process.ExitCode)"
          }

          Start-Sleep -Seconds 5


      # ============================================================
      # FIREWALL - VNC مسموح فقط لأجهزة Tailscale
      # ============================================================

      - name: Configure TightVNC Firewall
        shell: powershell
        run: |
          Get-NetFirewallRule `
            -DisplayName "TightVNC via Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "TightVNC via Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 5900 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host "Firewall rule created for Tailscale only."


      # ============================================================
      # START + VERIFY TIGHTVNC
      # ============================================================

      - name: Start and Verify TightVNC
        shell: powershell
        run: |
          $service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue

          if (-not $service) {
              throw "TightVNC service tvnserver was not found."
          }

          Set-Service `
            -Name "tvnserver" `
            -StartupType Automatic

          if ($service.Status -eq "Running") {
              Restart-Service `
                -Name "tvnserver" `
                -Force
          }
          else {
              Start-Service `
                -Name "tvnserver"
          }

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "tvnserver"

          Write-Host ""
          Write-Host "TightVNC Service:"
          Write-Host "Status: $($service.Status)"

          if ($service.Status -ne "Running") {
              throw "TightVNC service is not running."
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Host "Port 5900 is not listening yet. Restarting service..."

              Restart-Service `
                -Name "tvnserver" `
                -Force

              Start-Sleep -Seconds 5

              $listener = Get-NetTCPConnection `
                -LocalPort 5900 `
                -State Listen `
                -ErrorAction SilentlyContinue
          }

          if (-not $listener) {
              throw "TightVNC service is running but TCP port 5900 is not listening."
          }

          Write-Host ""
          Write-Host "TightVNC is listening on TCP 5900."


      # ============================================================
      # CONNECTION INFORMATION
      # ============================================================

      - name: Display Connection Details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             WINDOWS VNC IS READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : ${{ env.TAILSCALE_IP }}"
          Write-Host "VNC Port     : 5900"
          Write-Host "VNC Password : ${{ env.VNC_PASS }}"
          Write-Host ""
          Write-Host "RVNC Viewer Address:"
          Write-Host "${{ env.TAILSCALE_IP }}:5900"
          Write-Host ""
          Write-Host "--------------------------------------------------"
          Write-Host "RDP Backup"
          Write-Host "--------------------------------------------------"
          Write-Host "RDP IP       : ${{ env.TAILSCALE_IP }}"
          Write-Host "RDP Username : ${{ env.RDP_USER }}"
          Write-Host "RDP Password : ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "--------------------------------------------------"
          Write-Host "Windows preferences"
          Write-Host "--------------------------------------------------"
          Write-Host "Resolution       : 1920x1080 requested"
          Write-Host "Scale            : 100%"
          Write-Host "Wallpaper        : Default Windows wallpaper"
          Write-Host "High Performance : ON"
          Write-Host "Animations       : OFF"
          Write-Host "Transparency     : OFF"
          Write-Host ""
          Write-Host "=================================================="


      # ============================================================
      # KEEP WINDOWS ALIVE
      # ============================================================

      - name: Keep Session Alive
        shell: powershell
        run: |
          Write-Host "Windows session is active."

          while ($true) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') - Session active"
              Start-Sleep -Seconds 300
          }